<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estacle | Admin – Add Lead</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head><body>
<div class="app-layout">
{% set active = 'add_lead' %}
{% include 'partials/admin_sidebar.html' %}
<main class="main-content">
<header class="top-bar"><div><h1 class="page-title">Add Lead</h1><p class="page-subtitle">Capture a new inquiry</p></div></header>
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endif %}
{% endwith %}

<div class="panel form-panel"><form method="POST" class="admin-form">
<div class="form-row">
<div class="form-group"><label>Full name *</label><input name="full_name" required></div>
<div class="form-group"><label>Email</label><input type="email" name="email"></div>
</div>
<div class="form-row">
<div class="form-group"><label>Phone</label><input name="phone"></div>
<div class="form-group"><label>Source</label><select name="source"><option value="website">Website</option><option value="referral">Referral</option><option value="walkin">Walk-in</option><option value="social">Social</option><option value="other">Other</option></select></div>
</div>
<div class="form-row">
<div class="form-group"><label>Interest</label><input name="interest" placeholder="Buy / Rent / Area"></div>
<div class="form-group"><label>Budget</label><input type="number" name="budget" step="0.01"></div>
</div>
<div class="form-row">
<div class="form-group"><label>Status</label><select name="status"><option value="new">New</option><option value="contacted">Contacted</option><option value="qualified">Qualified</option></select></div>
<div class="form-group"><label>Assign agent</label><select name="assigned_to"><option value="">—</option>{% for a in agents %}<option value="{{ a.id }}">{{ a.full_name }}</option>{% endfor %}</select></div>
</div>
<div class="form-group"><label>Notes</label><textarea name="notes"></textarea></div>
<div class="form-actions"><button class="btn-primary" type="submit">Save Lead</button><a href="{{ url_for('admin.admin_leads') }}" class="btn-secondary">Cancel</a></div>
</form></div>

</main></div></body></html>
